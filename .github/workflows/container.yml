name: Container
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ploos-core:ci .
      - name: Smoke test
        run: |
          docker run -d --name core-ci --read-only --cap-drop ALL -p 127.0.0.1:18080:8080 ploos-core:ci
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:18080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/readyz)" = 503
          test "$(docker exec core-ci id -u)" = 65532
      - name: Cleanup
        if: always()
        run: docker rm -f core-ci || true
