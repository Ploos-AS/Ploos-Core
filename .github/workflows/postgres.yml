name: PostgreSQL migrations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/core_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Apply and test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/apply.psql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/tests/foundation.sql
      - name: Roll back and reapply
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0001_foundation.down.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/apply.psql
      - name: Verify repeated migration is safe
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/apply.psql
          test "$(psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM core_schema_migrations WHERE version IN (1,2)')" = 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Runtime database integration
        run: |
          go mod verify
          go test -v ./internal/storage
